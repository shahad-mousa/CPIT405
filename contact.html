    <!-- Contact Page -->
    <main class="page-content">

        <!-- Contact Profile Header -->
        <section class="cv-profile">

          <div class="cv-profile-mark contact-profile-icon">
    <span class="material-symbols-rounded">mail</span>
        </div>

            <div class="cv-profile-text">

                <p class="cv-label">GET IN TOUCH</p>

                <h1>Contact Me</h1>

                <p>I'd love to hear from you!</p>

                <span>Feel free to get in touch.</span>

            </div>

        </section>


        <!-- Contact Information and Form -->
        <section class="contact-container">

            <!-- Contact Information -->
            <div class="contact-info">

                <h2>Contact Information</h2>

                <p>
                    <strong>Email:</strong><br>

                    <a href="mailto:shahadalharbi094@gmail.com">

                <p>
                    <strong>Phone:</strong><br>

                    <a href="tel:0569660504">

                    </a>
                </p>

                <p>
                    <strong>Location:</strong><br>

                    Jeddah, Saudi Arabia
                </p>

            </div>


            <!-- Contact Form -->
            <div class="contact-form">

                <h2>Send Me a Message</h2>

                <form action="https://formsubmit.co/shahadalharbi094@gmail.com"
                      method="POST">

                    <label for="name">Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="message">Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message"
                        required
                    ></textarea>

                    <input
                        type="hidden"
                        name="_subject"
                        value="New Portfolio Message"
                    >

                    <button type="submit">
                        Send Message →
                    </button>

                </form>

            </div>

        </section>
